name: sync-from-litellm

# Daily pull from BerriAI/litellm upstream → propose changes via PR.
#
# Two PR flavours emerge:
#
#   `auto-update`             pricing changed on an existing entry.
#                             validator passes → auto-merge candidate.
#
#   `auto-add` +              new model not currently in registry.
#   `needs-tier-review`       sync script left `family: _TODO_` when it
#                             couldn't infer via longest-prefix; the
#                             validator blocks merge until a maintainer
#                             fills it in. Useful filter — most LiteLLM
#                             additions are noise we don't want anyway.
#
# Triggered:
#   - schedule: 09:00 UTC daily
#   - workflow_dispatch: manual run for testing

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run sync
        id: sync
        run: |
          python3 scripts/sync_from_litellm.py \
            --current models.json \
            --out     models.json.candidate \
            --diff    sync-diff.json
          # Surface counts as workflow outputs so the PR step can
          # branch on "additions only" vs "updates only" vs "mixed".
          python3 -c '
          import json, os
          d = json.load(open("sync-diff.json"))
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              f.write(f"additions={len(d[\"additions\"])}\n")
              f.write(f"updates={len(d[\"updates\"])}\n")
              f.write(f"any_change={int(bool(d[\"additions\"] or d[\"updates\"]))}\n")
          '

      - name: No-op if nothing changed
        if: steps.sync.outputs.any_change == '0'
        run: |
          echo "No upstream changes detected; exiting cleanly."

      - name: Apply candidate to models.json
        if: steps.sync.outputs.any_change == '1'
        run: mv models.json.candidate models.json

      - name: Determine PR labels
        if: steps.sync.outputs.any_change == '1'
        id: labels
        run: |
          labels="auto-sync"
          if [ "${{ steps.sync.outputs.additions }}" -gt "0" ]; then
            labels="$labels,auto-add,needs-tier-review"
          fi
          if [ "${{ steps.sync.outputs.updates }}" -gt "0" ]; then
            labels="$labels,auto-update"
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.sync.outputs.any_change == '1'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            Daily sync from LiteLLM upstream

            +${{ steps.sync.outputs.additions }} new models,
            ~${{ steps.sync.outputs.updates }} pricing updates.

            Generated by .github/workflows/sync-daily.yml; see
            sync-diff.json for the full diff.
          title: "Daily sync: +${{ steps.sync.outputs.additions }} new / ~${{ steps.sync.outputs.updates }} updated"
          body: |
            ## Sync diff

            - **${{ steps.sync.outputs.additions }} additions** — new models from LiteLLM not currently in registry
            - **${{ steps.sync.outputs.updates }} pricing updates** — same id, different `pricing_per_1m_usd`

            See `sync-diff.json` in this PR for the exact diff.

            ## Review checklist (for `auto-add` entries)

            - [ ] Confirm `family` is correct — the sync script infers via longest-prefix; `_TODO_` placeholders are unmatched and need manual fill
            - [ ] Confirm `tier` classification — heuristic uses keywords (`opus`/`mini`/`flash`/etc.); if wrong, override before merge
            - [ ] Decide whether to KEEP the addition — LiteLLM tracks many hosted variants we don't need (legacy `gpt-3.5-turbo-*`, `qwen3-vl-*`, etc.)

            ## Review checklist (for `auto-update` entries)

            - [ ] Cross-check the new price against the vendor's pricing page
            - [ ] If unsure, leave PR open until vendor's price page is verified

            🤖 Generated by `sync-from-litellm` workflow
          branch: auto-sync/litellm
          delete-branch: true
          labels: ${{ steps.labels.outputs.labels }}
